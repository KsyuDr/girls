[project]
name = "safe-city-backend"
version = "0.1.0"
description = "Бэкенд информационной системы «Безопасный город» (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff==0.17.4",
]

[tool.uv]
package = false

# ---------- ruff: линтер + форматтер (единый стиль кода) ----------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort — порядок импортов
    "N",    # pep8-naming
    "UP",   # pyupgrade — современный синтаксис
    "B",    # bugbear — типичные ошибки
    "C4",   # comprehensions
    "SIM",  # упрощения
    "RUF",  # правила ruff
    "ASYNC",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях — это нормально
    "B008",                        # Depends() в аргументах — стандарт FastAPI
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
