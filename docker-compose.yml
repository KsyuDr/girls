services:
  db:
    image: postgres:17-alpine
    container_name: safe_city_db
    environment:
      POSTGRES_USER: safe_city
      POSTGRES_PASSWORD: safe_city
      POSTGRES_DB: safe_city
    ports:
      - "5433:5432"
    volumes:
      - safe_city_pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe_city -d safe_city"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  safe_city_pgdata:
